name: Publish Release

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-release
  queue: max

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: true
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Build
        run: yarn build
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            node_modules/.yarn-state.yml
            packages/*/dist

  # The dry run packs the packages that are released, in a job that didn't run
  # the build: only the build output that the packages need is restored.
  publish-npm-dry-run:
    name: Dry run publish to NPM
    runs-on: ubuntu-latest
    needs: build
    outputs:
      checksums: ${{ steps.dry-run.outputs.checksums }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: true
          persist-credentials: false
          ref: ${{ github.sha }}
          skip-install: true
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output
      # Never extract the build output over the checkout: it could overwrite the
      # manifests.
      - name: Restore build output
        run: |
          mkdir -p node_modules
          cp "$RUNNER_TEMP/build-output/node_modules/.yarn-state.yml" node_modules/.yarn-state.yml
          for dist in "$RUNNER_TEMP"/build-output/packages/*/dist; do
            cp -R "$dist" "packages/$(basename "$(dirname "$dist")")/"
          done
      - name: Dry run publish to NPM
        id: dry-run
        uses: MetaMask/action-npm-publish@mrtenz/pack-on-dry-run
        with:
          dry-run: true
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          subteam: S042S7RE4AE # @metamask-npm-publishers

  publish-npm:
    name: Publish to NPM
    environment: npm-publish
    runs-on: ubuntu-latest
    needs: publish-npm-dry-run
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Publish to NPM
        uses: MetaMask/action-npm-publish@mrtenz/pack-on-dry-run
        with:
          dry-run: false
          checksums: ${{ needs.publish-npm-dry-run.outputs.checksums }}

  publish-release:
    name: Publish release to GitHub
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: publish-npm
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: true
          persist-credentials: false
          ref: ${{ github.sha }}
          skip-install: true
      - uses: MetaMask/action-publish-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
