name: Publish Release

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-release
  queue: max

jobs:
  build:
    name: Build and pack release
    runs-on: ubuntu-latest
    outputs:
      has-packages: ${{ steps.pack.outputs.has-packages }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: true
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Build
        run: yarn build
      - name: Pack packages
        id: pack
        uses: MetaMask/action-npm-publish/pack@mrtenz/publish-tarballs

  # The jobs that publish are skipped if no packages were packed, and so is the
  # job that creates the GitHub release, which needs them.
  publish-npm-dry-run:
    name: Dry run publish to NPM
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.has-packages == 'true'
    steps:
      - name: Dry run publish to NPM
        uses: MetaMask/action-npm-publish@mrtenz/publish-tarballs
        with:
          use-pack: true
          dry-run: true
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          subteam: S042S7RE4AE # @metamask-npm-publishers

  publish-npm:
    name: Publish to NPM
    environment: npm-publish
    runs-on: ubuntu-latest
    needs: publish-npm-dry-run
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Publish to NPM
        uses: MetaMask/action-npm-publish@mrtenz/publish-tarballs
        with:
          use-pack: true
          dry-run: false
          npm-token: ${{ secrets.NPM_TOKEN }}

  publish-release:
    name: Publish release to GitHub
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: publish-npm
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: true
          persist-credentials: false
          ref: ${{ github.sha }}
          skip-install: true
      - uses: MetaMask/action-publish-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
