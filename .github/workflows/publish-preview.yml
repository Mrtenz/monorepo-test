name: Publish a preview build

on:
  issue_comment:
    types: created

permissions:
  contents: read

jobs:
  publish-preview:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '@metamaskbot publish-preview') }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: MetaMask/github-tools/.github/workflows/publish-preview-oidc.yml@71467355933d12d921a12634f4a10aab7fafdbac
    with:
      environment: default-branch
      docs-url: 'https://github.com/MetaMask/release-tools/blob/main/docs/processes/preview-builds.md'
      dry-run: true
