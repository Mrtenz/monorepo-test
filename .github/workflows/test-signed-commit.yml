name: Test signed commit

on:
  push:
    branches:
      - mrtenz/test-signed-commit

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The checkout is only moved onto the signed commit if it is on the
      # branch that was committed to.
      - name: Check out the target branch
        run: git checkout -b "test-signed-commit-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Stage new files
        run: |
          echo "hello" > new-file.txt
          printf '#!/bin/sh\necho hi\n' > script.sh
          chmod +x script.sh
          ln -s new-file.txt link.txt
          git add new-file.txt script.sh link.txt

      - name: Create signed commit on a new branch
        id: first
        uses: MetaMask/github-tools/.github/actions/create-signed-commit@mrtenz/signed-commit-action
        with:
          branch: test-signed-commit-${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: 'Test: add files on a new branch'

      - name: Verify first commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.first.outputs.commit-sha }}
        run: |
          test -n "$COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test "$(git rev-parse "refs/remotes/origin/test-signed-commit-${{ github.run_id }}-${{ github.run_attempt }}")" = "$COMMIT_SHA"
          test -z "$(git status --porcelain)"
          git ls-tree HEAD script.sh | grep -q '^100755 '
          git ls-tree HEAD link.txt | grep -q '^120000 '
          gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq .commit.verification
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq .commit.verification.verified)" = true

      - name: Stage a modification and a deletion
        run: |
          echo "more" >> new-file.txt
          git rm -q link.txt
          git add new-file.txt

      - name: Create signed commit on the existing branch
        id: second
        uses: MetaMask/github-tools/.github/actions/create-signed-commit@mrtenz/signed-commit-action
        with:
          branch: test-signed-commit-${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: 'Test: modify and delete files on an existing branch'

      - name: Verify second commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.second.outputs.commit-sha }}
        run: |
          test -n "$COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test -z "$(git status --porcelain)"
          test ! -e link.txt
          test -z "$(git ls-tree HEAD link.txt)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq .commit.verification.verified)" = true

      - name: Nothing staged
        id: third
        uses: MetaMask/github-tools/.github/actions/create-signed-commit@mrtenz/signed-commit-action
        with:
          branch: test-signed-commit-${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: 'Test: nothing to commit'

      - name: Verify nothing was committed
        env:
          COMMIT_SHA: ${{ steps.third.outputs.commit-sha }}
        run: test -z "$COMMIT_SHA"

      - name: Stage changes that differ from the working tree
        run: |
          # The staged content differs from the working tree.
          echo "staged" > index-file.txt
          git add index-file.txt
          echo "unstaged" >> index-file.txt

          # The removal is staged, but the file stays on disk.
          git rm -q --cached new-file.txt

          # The mode change is staged, but the file stays executable on disk.
          git update-index --chmod=-x script.sh

      - name: Create signed commit from the index
        id: fourth
        uses: MetaMask/github-tools/.github/actions/create-signed-commit@mrtenz/signed-commit-action
        with:
          branch: test-signed-commit-${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: 'Test: commit the index, not the working tree'

      - name: Verify the index was committed
        env:
          COMMIT_SHA: ${{ steps.fourth.outputs.commit-sha }}
        run: |
          set -x
          test -n "$COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test "$(git show HEAD:index-file.txt)" = staged
          test -z "$(git ls-tree HEAD new-file.txt)"
          git ls-tree HEAD script.sh | grep -q '^100644 '

          # The working tree is left alone, so it still differs from the new
          # HEAD: the unstaged edit, the mode change, and the untracked file.
          test -e new-file.txt
          test -x script.sh
          git status --porcelain
          test "$(git status --porcelain)" = " M index-file.txt
           M script.sh
          ?? new-file.txt"

  persisted-credentials:
    runs-on: ubuntu-latest
    steps:
      # The default checkout persists credentials as an `http.extraheader`.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check that an empty extraheader clears the persisted header
        env:
          GIT_TRACE_CURL: '1'
        run: |
          url="https://github.com/$GITHUB_REPOSITORY"
          count() { grep -ci 'Send header: Authorization' || true; }

          git config --get-all http.https://github.com/.extraheader | sed 's/basic .*/basic <redacted>/'

          without="$(git ls-remote "$url" HEAD 2>&1 | count)"
          with="$(git -c http.https://github.com/.extraheader= ls-remote "$url" HEAD 2>&1 | count)"
          echo "Authorization headers without clearing: $without, with clearing: $with"

          test "$without" -ge 1
          test "$with" -eq 0

      - name: Check out the target branch
        run: git checkout -b "test-persisted-credentials-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Stage a file
        run: |
          echo "hello" > persisted-file.txt
          git add persisted-file.txt

      - name: Create signed commit
        id: commit
        uses: MetaMask/github-tools/.github/actions/create-signed-commit@mrtenz/signed-commit-action
        with:
          branch: test-persisted-credentials-${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: 'Test: persisted credentials'

      - name: Verify commit
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
        run: |
          set -x
          test -n "$COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test "$(git rev-parse "refs/remotes/origin/test-persisted-credentials-${{ github.run_id }}-${{ github.run_attempt }}")" = "$COMMIT_SHA"
          test -z "$(git status --porcelain)"

  other-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record the state of the checkout
        run: |
          {
            echo "HEAD_BEFORE=$(git rev-parse HEAD)"
            echo "BRANCH_BEFORE=$(git symbolic-ref --short HEAD)"
            echo "TRACKING_BEFORE=$(git rev-parse "refs/remotes/origin/$(git symbolic-ref --short HEAD)")"
          } >> "$GITHUB_ENV"

      - name: Stage a file
        run: |
          echo "hello" > other-file.txt
          git add other-file.txt

      - name: Create signed commit on a different branch
        id: commit
        uses: MetaMask/github-tools/.github/actions/create-signed-commit@mrtenz/signed-commit-action
        with:
          branch: test-other-branch-${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: 'Test: commit to a different branch'

      - name: Verify the checkout was left alone
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
        run: |
          set -x
          test -n "$COMMIT_SHA"

          # The checked out branch has not moved, locally or remotely.
          test "$(git rev-parse HEAD)" = "$HEAD_BEFORE"
          test "$(git symbolic-ref --short HEAD)" = "$BRANCH_BEFORE"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH_BEFORE")" = "$TRACKING_BEFORE"

          # The change is still staged, and the other branch is tracked.
          test "$(git diff --cached --name-only)" = other-file.txt
          test "$(git rev-parse "refs/remotes/origin/test-other-branch-${{ github.run_id }}-${{ github.run_attempt }}")" = "$COMMIT_SHA"

  detached-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Stage a file
        run: |
          git checkout --detach
          echo "hello" > detached-file.txt
          git add detached-file.txt

      - name: Create signed commit
        id: commit
        uses: MetaMask/github-tools/.github/actions/create-signed-commit@mrtenz/signed-commit-action
        with:
          branch: test-detached-head-${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: 'Test: commit from a detached HEAD'

      - name: Verify the checkout was moved
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
        run: |
          set -x
          test -n "$COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git status --porcelain)"
